    delete:
      operationId: Delete_User
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid token
  /api/users/{id}/blogs/:
    get:
      operationId: Get_User_Blogs
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - users
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlogList'
              examples:
                ExampleResponse:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - id: 1
                      user: 1
                      author:
                        id: 1
                        username: lyang
                        first_name: Robert
                        last_name: Oliver
                      title: Doloremque et et.
                      content: Discuss than some debate this. Entire him certain single
                        west rock......
                      created_at: '2021-06-11'
                  summary: Detailed example
          description: ''
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
      required:
      - id
      - is_staff
      - username
    AuthTokenRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    AuthorFilterError:
      type: object
      properties:
        author:
          type: array
          items:
            type: string
      required:
      - author
    AuthorSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
      required:
      - first_name
      - id
      - last_name
      - username
    Blog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        author:
          allOf:
          - $ref: '#/components/schemas/AuthorSummary'
          readOnly: true
        title:
          type: string
          maxLength: 200
        content:
          type: string
        created_at:
          type: string
          format: date
          readOnly: true
      required:
      - author
      - content
      - created_at
      - id
      - title
      - user
    BlogRequest:
      type: object
      properties:
        user:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
      required:
      - content
      - title
      - user
    DbEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        db:
          $ref: '#/components/schemas/DbEnum'
      required:
      - status
    LoginError:
      type: object
      properties:
        non_field_errors:
          type: array
          items:
            type: string
      required:
      - non_field_errors
    PaginatedBlogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Blog'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedBlogRequest:
      type: object
      properties:
        user:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
    PatchedUserUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 200
        last_name:
          type: string
          minLength: 1
          maxLength: 200
        username:
          type: string
          minLength: 1
          maxLength: 200
        mobile:
          type: string
          nullable: true
          maxLength: 20
        password:
          type: string
          writeOnly: true
          minLength: 6
          maxLength: 256
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
    StatusEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    Token:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 200
        last_name:
          type: string
          maxLength: 200
        username:
          type: string
          maxLength: 200
        mobile:
          type: string
          nullable: true
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 254
        register_at:
          type: string
          format: date
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
      - register_at
      - username
    UserRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 200
        last_name:
          type: string
          minLength: 1
          maxLength: 200
        username:
          type: string
          minLength: 1
          maxLength: 200
        mobile:
          type: string
          nullable: true
          maxLength: 20
        password:
          type: string
