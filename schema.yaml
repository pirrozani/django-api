openapi: 3.0.3
info:
  title: DjangoAPI
  version: 0.1.0
  description: User and Blog API for Django project. Authorize with tokenAuth using
    the format "Token <token>".
paths:
  /api/auth/logout/:
    post:
      operationId: Delete_Auth_Token
      tags:
      - auth
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid token
  /api/auth/me/:
    get:
      operationId: Get_Auth_Me
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid token
  /api/auth/token/:
    post:
      operationId: Create_Auth_Token
      tags:
      - auth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
          description: Wrong or missing credentials
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Too many login attempts
  /api/blogs/:
    get:
      operationId: Get_Blogs
      parameters:
      - in: query
        name: author
        schema:
          type: integer
        description: Only blogs by this author id
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - blogs
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlogList'
              examples:
                ExampleResponse:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - id: 1
                      user: 1
                      author:
                        id: 1
                        username: lyang
                        first_name: Robert
                        last_name: Oliver
                      title: Doloremque et et.
                      content: Discuss than some debate this. Entire him certain single
                        west rock......
                      created_at: '2021-06-11'
                  summary: Detailed example
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorFilterError'
          description: '`author` is not an integer'
    post:
      operationId: Create_Blog
      tags:
      - blogs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogRequest'
            examples:
              ExampleRequest:
                value:
                  user: 1
                  title: Doloremque et et.
                  content: Discuss than some debate this. Entire him certain single
                    west rock......
                summary: Create or update a blog
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlogRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'
              examples:
                ExampleResponse:
                  value:
                    id: 1
                    user: 1
                    author:
                      id: 1
                      username: lyang
                      first_name: Robert
                      last_name: Oliver
                    title: Doloremque et et.
                    content: Discuss than some debate this. Entire him certain single
                      west rock......
                    created_at: '2021-06-11'
                  summary: Detailed example
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid token
  /api/blogs/{id}/:
    get:
      operationId: Get_Blog
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this blog.
        required: true
      tags:
      - blogs
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'
              examples:
                ExampleResponse:
                  value:
                    id: 1
                    user: 1
                    author:
                      id: 1
                      username: lyang
                      first_name: Robert
                      last_name: Oliver
                    title: Doloremque et et.
                    content: Discuss than some debate this. Entire him certain single
                      west rock......
                    created_at: '2021-06-11'
                  summary: Detailed example
          description: ''
    put:
      operationId: Update_Blog
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this blog.
        required: true
      tags:
      - blogs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogRequest'
            examples:
              ExampleRequest:
                value:
                  user: 1
                  title: Doloremque et et.
                  content: Discuss than some debate this. Entire him certain single
                    west rock......
                summary: Create or update a blog
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlogRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'
              examples:
                ExampleResponse:
                  value:
                    id: 1
                    user: 1
                    author:
                      id: 1
                      username: lyang
                      first_name: Robert
                      last_name: Oliver
                    title: Doloremque et et.
                    content: Discuss than some debate this. Entire him certain single
                      west rock......
                    created_at: '2021-06-11'
                  summary: Detailed example
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid token
    patch:
      operationId: Partial_Update_Blog
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this blog.
        required: true
      tags:
      - blogs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBlogRequest'
            examples:
              ExampleRequest:
                value:
                  user: 1
                  title: Doloremque et et.
                  content: Discuss than some debate this. Entire him certain single
                    west rock......
                summary: Create or update a blog
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBlogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBlogRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'
              examples:
                ExampleResponse:
                  value:
                    id: 1
                    user: 1
                    author:
                      id: 1
                      username: lyang
                      first_name: Robert
                      last_name: Oliver
                    title: Doloremque et et.
                    content: Discuss than some debate this. Entire him certain single
                      west rock......
                    created_at: '2021-06-11'
                  summary: Detailed example
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid token
    delete:
      operationId: Delete_Blog
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this blog.
        required: true
      tags:
      - blogs
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Missing or invalid token
  /api/health/:
    get:
      operationId: Get_Health
      parameters:
      - in: query
        name: db
        schema:
          type: string
          enum:
          - '1'
        description: '`1` also runs `SELECT 1` against the database'
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
