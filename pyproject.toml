[project]
name = "django-api"
version = "0.2.1"
description = "Django REST Framework API for authors and blogs (backend for a React SPA)"
requires-python = "==3.12.*"
dependencies = [
    "django>=5.2,<5.3",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14",
    "djangorestframework>=3.18",
    "drf-spectacular>=0.30",
    "faker>=40",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
extend-exclude = ['staticfiles']

[tool.ruff.lint]
select = ['E', 'F', 'I']

[tool.ruff.lint.per-file-ignores]
'api/migrations/*' = ['E501']

[tool.ruff.format]
quote-style = 'single'
