[project]
name = "django-api"
version = "0.1.0"
description = "Django REST Framework API for authors and blogs (backend for a React SPA)"
requires-python = "==3.12.*"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14",
    "djangorestframework>=3.18",
    "drf-spectacular>=0.30",
    "faker>=40",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]
